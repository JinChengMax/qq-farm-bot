name: Sync Upstream

on:
  schedule:
    # 北京时间每天 10:00、18:00、次日 00:00 执行
    # GitHub Actions 使用 UTC：
    # 02:00 UTC = 北京时间 10:00
    # 10:00 UTC = 北京时间 18:00
    # 16:00 UTC = 北京时间次日 00:00
    - cron: "0 2,10,16 * * *"

  # 支持手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. 拉取自己的仓库
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 2. 配置 Git
      # ==========================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ==========================================
      # 3. 添加上游仓库
      # ==========================================
      - name: Add upstream repository
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/xxxscarlxrd404/qq-farm-bot.git

      # ==========================================
      # 4. 同步上游 main
      # ==========================================
      - name: Sync upstream main
        run: |
          # 备份自己的 GitHub Actions 工作流
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml

          # 获取上游 main
          git fetch upstream main

          # 切换到自己的 main
          git checkout main

          # main 完全同步上游
          git reset --hard upstream/main

          # 恢复自己的同步工作流
          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml

          # 提交工作流
          git add .github/workflows/sync-upstream.yml
          git commit -m "chore: preserve sync workflow" || echo "工作流文件无变化"

          # 推送 main
          git push origin main --force

      # ==========================================
      # 5. 把 main 合并到 YYB-Go 外部登录整合分支
      # ==========================================
      - name: Merge main into YYB-Go integration branch
        run: |
          echo "========================================"
          echo "开始同步 main → local/yyb-farm-integration"
          echo "========================================"

          # 获取 GitHub 上最新的两个分支
          git fetch origin main
          git fetch origin local/yyb-farm-integration

          # 切换到 YYB-Go 整合分支
          git checkout -B local/yyb-farm-integration origin/local/yyb-farm-integration

          echo ""
          echo "当前分支："
          git branch --show-current

          echo ""
          echo "当前提交："
          git log -1 --oneline

          echo ""
          echo "开始合并 main..."

          # 将 main 合并进 YYB-Go 整合分支
          git merge origin/main --no-edit

          echo ""
          echo "========================================"
          echo "main 合并完成"
          echo "========================================"

          echo ""
          echo "最新提交："
          git log -3 --oneline

          # 推送整合分支
          git push origin local/yyb-farm-integration

          echo ""
          echo "========================================"
          echo "YYB-Go 整合分支同步完成"
          echo "========================================"
